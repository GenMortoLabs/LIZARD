# The web app (lizard-web/app) built from a clean checkout, as a check. The site is Cloudflare Pages' (its own build of
# main); nothing here publishes it.
name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.9

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Emscripten (cached)
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: The codec, the fountain and the compression (one module)
        run: |
          source ~/emsdk/emsdk_env.sh
          liblizard/build.sh

      - name: The web app
        run: liblizard/build.sh app
