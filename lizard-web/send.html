<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIZARD sender</title><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="../liblizard/vendor/fonts/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="ui.css">
<style>
  /* ai: Layout only; the look is ui.css. <main> is the paint area: send.mjs measures its client box to pick the */
  /* ai: version (room()), sizes #c (the wasm path's, 2D) or #cg (the GPU encoder's, WebGPU: a canvas holds one kind of */
  /* ai: context) in it (layout()) and fills it with the surround (paintSurround()). So nothing the */
  /* ai: controls do may move that box while a symbol is painted: a resize re-picks the version mid-stream. */
  /* ai: Portrait (a phone sending): the bar and the controls on top, <main> the rest of one screen. svh, so a phone's */
  /* ai: address bar coming and going moves nothing (vh where there is no svh). Settings and Developer Tools hang below */
  /* ai: that screen, reached by scrolling or the bar's Settings, so opening them never shrinks <main>. */
  #stage{position:relative;display:flex;flex-direction:column;height:100vh;height:100svh}
  #col,#pane{display:contents}
  .bar{padding:0 16px}
  #side{flex:none;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
  #side .row>button,#side .row>.btn{flex:1 1 0}
  /* ai: the sending row's buttons 16 px in from their ends, the PC's (lizard-ui Send.kt Side: pad 16 dp), so Stop,
     Resume and Fullscreen keep one row in the default column */
  #stop,#pause,#fs{padding:0 16px}
  /* ai: no button stretches to fit on a PC (2026-11-06): under a mouse, or no pointer, each its label's width, as the
     receiver's Start; under a finger they share the row */
  @media (pointer:fine),(pointer:none){#side .row>button,#side .row>.btn{flex:0 0 auto}}
  /* ai: One line each, so a long name or a figure never grows the controls and shrinks <main> under a painted symbol. */
  /* ai: An error wraps: nothing is painted then. */
  #state{margin:.5rem 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ai: what went wrong, said over the code area (2026-11-07, the receiver's #idle.err; a red line in the column
     before): the soft fill, the red triangle, the words under it */
  #err{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;margin:0;padding:0 24px;text-align:center;background:var(--soft);color:var(--muted);font-size:14px}
  #err[hidden]{display:none}#err>svg.i{width:24px;height:24px;color:var(--bad)}
  /* ai: a pick being read (a dropped folder walked): a spinner, no words (2026-11-07; "Reading the files" before) */
  #state .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--fg);border-radius:50%;animation:dt-spin .8s linear infinite;vertical-align:middle}
  #settings{position:absolute;top:100%;left:0;right:0;margin:0;padding:0 16px 1rem}
  #settings label select{width:100%}
  details.dev select,details.dev input{width:100%}
  main{flex:1 1 0;min-height:0;display:grid;place-items:center;overflow:hidden;background:var(--bg);position:relative}
  /* The surround sits behind the symbol and fills <main>; the symbol's canvas keeps its own painted margin. */
  #bgc{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
  #c,#cg{position:relative;z-index:1}
  canvas{image-rendering:pixelated}
  /* ai: the file upload (send.mjs showChoice, renderPick; 2026-10-26, LocalSend's geometry): over <main> while no send
     paints, centred by inset and auto margins: the File and Folder tiles, then the selection's card (ui.css .tiles,
     .sel), the card taking what height is left and its items scrolling down inside it, nothing else scrolling */
  #pick{position:absolute;inset:0;margin:auto;z-index:2;width:min(36rem,calc(100% - 32px));height:fit-content;
    max-height:calc(100% - 32px);display:flex;flex-direction:column;gap:16px;padding:16px;background:var(--bg)}
  #pick>.tiles{flex:none}
  #sel{display:flex;flex-direction:column;min-height:0}
  #pickList{min-height:0;overflow-y:auto}
  /* ai: the card always there (2026-11-07, the apps' Upload): "0 items" over a row's empty room while nothing is chosen */
  #pickList:empty{min-height:104px}
  /* ai: what goes, under the card (2026-11-06, the PC sender's ChoiceLine): the name semibold, its stem cut and its
     ending kept, then ", N files, " for a bundle and the size, regular and muted; centred, one line, 12 px under */
  #selSum .tot{font-weight:400;color:var(--muted)}
  /* ai: a file dragged over the page: the whole of <main> takes the drop, and the outline says so */
  main.drop{outline:3px dashed var(--fg);outline-offset:-12px}
  /* ai: Landscape and desktop: a 20rem column beside <main>, the bar fixed at its top and the controls over Settings in */
  /* ai: a pane under it that scrolls on its own (#pane, 2026-10-02, its scrollbar below the top bar, */
  /* ai: as the receiver's), so Developer Tools opens inside it. The figures' reserved line is portrait's alone (it keeps <main> */
  /* ai: still there); here an empty state or figures line takes no room. */
  @media (orientation:landscape){
    #stage{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
    body.collapsed #pane{display:none}
    #col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
    #pane{display:block;flex:1 1 0;min-height:0;overflow-y:auto}
    .bar{padding:0 12px}
    #side{padding:12px 12px 0;border-bottom:0}
    #settings{padding:0 12px 1rem}
    #settings{position:static}
    /* ai: the PC's column (lizard-ui Send.kt Side, Column.kt ToolLandscape): the bar's hairline inside the column's
       padding (the rail's across it), what goes 12 px under the row as elements (#dt, ui.mjs details: its rows the same
       from Start, so nothing under them moves) or an error; 16 px before the folds. A line the font's own height (the
       apps' Compose text has no leading over its first line or under its last) */
    .bar{border-bottom:0;position:relative;min-height:57px;padding-bottom:1px}
    .bar::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:1px;background:var(--line)}
    body.collapsed .bar::after{left:0;right:0}
    #state{margin:12px 0 0;line-height:normal}
    #state:empty{display:none}
    #dev{margin-top:16px}
  }
  /* ai: under a mouse (or no pointer) each 40 px button in a 48 px target, as the PC's (lizard-ui LocalTarget) */
  @media (orientation:landscape) and (pointer:fine),(orientation:landscape) and (pointer:none){#side .row>button{margin:4px 0}}
  /* ai: Fullscreen shows the code and nothing else; a tap on it or Escape brings the controls back (send.mjs). */
  body.full #col{display:none}
  body.full #stage{grid-template-columns:minmax(0,1fr)}
</style>
<div id="stage">
  <div id="col">
    <header class="bar"><a class="btn icon back" href="index.html" title="Home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span class="sr-only">Home</span></a><h1>Send</h1><span class="grow"></span><a id="swap" class="btn text" href="recv.html" title="Switch to the receiver page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg>Receiver</a><button id="collapse" class="btn icon collapse" type="button" title="Hide sidebar" aria-expanded="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg><span class="sr-only">Sidebar</span></button></header>
    <!-- ai: the collapsed rail (ui.css .rail, send.mjs showRail): pause or resume, and the code's capacity; at its foot a
         "?" opening the display tip (2026-10-03, after the S26 broke 2.90 MB/s in 2:1 once the monitor's contrast was at
         its maximum, STATUS "The oscillation in 2:1"): a popover (ui.css .pop), dismissed by a click elsewhere or Escape -->
    <div id="rail" class="rail"><button id="railSend" class="btn icon off" type="button" title="Start"><svg class="i pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><svg class="i play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l14 9-14 9z"/></svg></button><span id="railRate" class="rate" aria-live="off"></span><button id="railHelp" class="btn icon help" type="button" title="Tip" popovertarget="tipDisplay"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span class="sr-only">Tip</span></button><a id="railHome" class="btn icon home" href="index.html" title="Home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span class="sr-only">Home</span></a></div>
    <div id="tipDisplay" class="pop" popover>To maximize efficiency, increase the contrast and brightness of your display. Turn off power saving: it can make pictures drop.</div>
    <!-- ai: the same tip before the first send on this browser (send.mjs go, 2026-10-04); the browser's limit is the
         receiver's notice alone since 2026-10-22 -->
    <div id="pane">
    <div id="side">
      <div class="row"><button id="go" class="primary" disabled>Start</button><button id="stop" hidden>Stop</button><button id="pause" hidden>Pause</button><button id="fs">Fullscreen</button></div>
      <p id="state" class="status" role="status"></p>
      <div id="dt" class="dt" role="status" hidden></div>
    </div>
    <section id="settings" class="settings">
      <!-- ai: Settings and Developer Tools, two rows that open (2026-10-02): Settings (#dev, its open state and every control in
           it kept) holds the encoder and the code (blocks a frame, the rate its word states, its size, the gap, the ring,
           the codes); Developer Tools (#logs) what is sent (2026-10-03: the test stream is for developers and testers)
           and the readout; About the last row. Options and labels bare. -->
    <details id="dev" class="dev"><summary>Settings</summary>
      <div class="grid">
        <!-- ai: GPU and CPU alone (2026-10-05): with neither chosen the encoder is auto's (the GPU where it builds and its first
             frame is the C's, else the CPU), held by a hidden option that names the one auto runs (send.mjs showEnc) -->
        <label>Encoder <select id="enc"><option value="auto" selected hidden disabled>GPU</option><option value="gpu">GPU</option><option value="wasm">CPU</option></select></label>
      </div>
      <fieldset id="f-focus"><legend>Code</legend>
        <div class="grid">
          <!-- ai: the format's size, a slider of versions 4 to 64 (16 sub-channels a step; its first step auto, the largest
               that fit the room, until 2026-11-07); #subch the value the page reads (the sub-channels), the slider a
               view over it (send.mjs); its label the rate profile's blocks, titled Blocks with Show statistics on and
               Density, the bytes alone, with it off (#blocksTitle) -->
          <div class="blocks"><span class="row"><span id="blocksTitle">Density</span><span id="blocksOut">58, 27.4 KB</span></span><input id="blocks" type="range" min="4" max="64" step="1" value="30" data-view aria-label="blocks"><input id="subch" type="hidden" value="480"></div>
          <!-- ai: the display rate, 1 to 60, which the word states -->
          <div class="blocks"><span class="row"><span>FPS</span><span id="fpsOut">60</span></span><input id="fps" type="range" min="1" max="60" step="1" value="60" aria-label="FPS"></div>
          <!-- ai: the code's size, a share of <main>'s room, 25 to 100% (send.mjs sizeOf), so the code can be kept off a monitor's edges -->
          <div class="blocks"><span class="row"><span>Size</span><span id="sizeOut">100%</span></span><input id="size" type="range" min="25" max="100" step="1" value="100" aria-label="size"></div>
          <!-- ai: the light between two codes' rings, 4 to 68 modules (send.mjs spacingOf), shown with two codes; and between a
               ring and the area's edge, 2 to 34 (marginOf) -->
          <div class="blocks" id="spacingRow" hidden><span class="row"><span>Spacing</span><span id="spacingOut">16 modules</span></span><input id="spacing" type="range" min="4" max="68" step="1" value="16" aria-label="spacing"></div>
          <div class="blocks"><span class="row"><span>Margin</span><span id="marginOut">8 modules</span></span><input id="margin" type="range" min="2" max="34" step="1" value="8" aria-label="margin"></div>
          <!-- ai: the ring, the 128 by default (sim/lizard_pick.mjs RING_DEFAULT; an Auto option, the same ring, until 2026-10-05),
               named by its border's look with Show statistics off (Thin the 256, Medium the 128, Thick the 64, that order)
               and by its cells with it on (64, 128, 256): send.mjs ringOptions, the inline script below -->
          <label>Ring <select id="ring"><option value="256">Thin</option><option value="128" selected>Medium</option><option value="64">Thick</option></select></label>
          <!-- ai: two codes side by side for the app's 2:1 crop (2026-09-28); "(browsers cannot decode 2 codes)" after Two until
               2026-10-05, when it went for being wider than the menu -->
          <label>Codes <select id="codes"><option value="1" selected>1</option><option value="2">2</option></select></label>
        </div>
      </fieldset>
    </details>
    <details id="logs" class="dev"><summary>Developer Tools</summary>
      <div class="grid">
        <!-- ai: Show statistics, the receiver's setting (recv:stats) shown here too, one switch for both pages -->
        <label>Show statistics <select id="stats" data-shared="recv:stats"><option value="0" selected>Off</option><option value="1">On</option></select></label>
        <label>Payload <select id="payload"><option value="file" selected>File</option><option value="test">Test stream</option></select></label>
      </div>
      <pre id="tx" class="readout"></pre>
    </details>
      <details class="dev" id="aboutFold"><summary>About</summary><div id="about" class="about-text"></div></details>
      <a id="source" class="item" href="https://github.com/FNWTalon/LIZARD" target="_blank" rel="noopener"><span class="body"><span class="t">Source code</span></span></a>
    </section>
    <script>
    // ai: Saved state before the first paint (2026-10-02): the modules run after the page is
    // ai: drawn (send.mjs awaits the codec first), so Settings and Developer Tools opened, and the kept values moved, a moment
    // ai: after the page showed, the chevrons turning as they did. ui.mjs remember and persist's rules, the same keys; the
    // ai: blocks slider and the labels drawn from the values as send.mjs showBlocks and showFps draw
    // ai: them. The modules run them again later and change nothing. The blocks a frame are the rate profile's
    // ai: (sim/lizard_pick.mjs tiersFor, src/lizard_phy.c lizard_tiers_for): over the frame's 640 s slots, a 7/8 blocks of 4496,
    // ai: t 2/3 of 5760 and c 1/2 of 7680 nearest 39, 15 and 20% of them in least squares (in units of 16 slots),
    // ai: the 3/4 blocks of 5152 filling, a + m + t + c blocks; a value that is no format (LIZARD-64 to -1024 in steps of
    // ai: 16; a kept "auto" from before 2026-11-07 among them) is the page's default, LIZARD-480, as send.mjs makes it.
    (() => { try {
      const ls = localStorage, $ = (id) => document.getElementById(id);
      for (const id of ["dev", "logs"]) { const v = ls.getItem("send:" + id); if (v !== null) $(id).open = v === "1"; }
      if (ls.getItem("send:collapsed") === "1") document.body.classList.add("collapsed"); { const w = +ls.getItem("send:side"); if (w > 0) document.documentElement.style.setProperty("--side", Math.max(180, Math.min(w, innerWidth * 0.6)) + "px"); }
      for (const el of document.querySelectorAll("#dev select, #dev input, #logs select")) {
        if (el.type === "file" || "view" in el.dataset) continue;
        const v = ls.getItem(el.dataset.shared || "send:" + el.id);
        if (v !== null && (el.tagName !== "SELECT" || [...el.options].some((o) => o.value === v))) el.value = v;
      }
      if (!(+$("subch").value >= 64 && +$("subch").value <= 1024 && +$("subch").value % 16 === 0)) $("subch").value = "480";   // ai: #subch's own (a hidden input's defaultValue follows each set)
      const s = +$("subch").value, v = s / 16;
      let k = 0;
      {
        const all = 40 * s;
        let best = -1;
        for (let a = 0; 281 * a <= all - 322; a++) for (let t = 0; 281 * a + 360 * t <= all - 322; t++) for (let c = 0; 281 * a + 360 * t + 480 * c <= all - 322; c++) {
          const d7 = 281000 * a - 390 * all, d3 = 360000 * t - 150 * all, d2 = 480000 * c - 200 * all, cost = d7 * d7 + d3 * d3 + d2 * d2;
          if (best < 0 || cost < best) { best = cost; k = a + t + c + Math.floor((all - 281 * a - 360 * t - 480 * c) / 322); }
        }
      }
      $("blocks").value = String(v);
      // ai: Show statistics on: Blocks with the count and the ring by its cells; off: Density, the bytes alone, the ring by
      // ai: its border's look (send.mjs showStatsLabels)
      const stats = $("stats").value === "1", kb = `${(k * 472 / 1000).toFixed(1)} KB`;
      $("blocksTitle").textContent = stats ? "Blocks" : "Density";
      if (stats) { const r = $("ring"), rv = r.value; r.innerHTML = [64, 128, 256].map((x) => `<option value="${x}">${x}</option>`).join(""); r.value = rv; }
      $("blocksOut").textContent = stats ? `${k}, ${kb}` : kb;   // ai: 472 B a block (sim/xfer.mjs PAYLOAD), before the modules load
      $("fpsOut").textContent = `${+$("fps").value}`;
      $("sizeOut").textContent = `${+$("size").value}%`;
      $("spacingOut").textContent = `${+$("spacing").value} modules`;
      $("spacingRow").hidden = $("codes").value !== "2";
      $("marginOut").textContent = `${+$("margin").value} modules`;
    } catch {} })();
    </script>
    </div>
  </div>
  <main><canvas id="bgc"></canvas><canvas id="c"></canvas><canvas id="cg" hidden></canvas><div id="pick" class="pick" hidden><div class="tiles"><button id="addFiles" class="tile" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>File</button><button id="addFolder" class="tile" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Folder</button></div><div id="sel" class="sel"><div class="head"><span id="selSum"></span><button id="clearPick" class="text" type="button">Clear</button></div><ul id="pickList" class="items"></ul></div></div><p id="err" role="alert" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><span id="errText"></span></p><input id="file" type="file" multiple class="sr-only" aria-label="Choose files"><input id="folder" type="file" webkitdirectory class="sr-only" aria-label="Choose a folder"></main>
</div>
<script type="module" src="send.mjs"></script>
