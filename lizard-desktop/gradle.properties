org.gradle.jvmargs=-Xmx2g
kotlin.code.style=official
# ai: the shared UI's Android target (../lizard-ui) resolves AndroidX artifacts, which the Android plugin checks for here too
android.useAndroidX=true
# ai: Compose's packaging tasks keep their working folders (build/compose/tmp/<task>): the MSI is made a second time from
# ai: its task's own arguments and jars, with jpackage's installer template (build.gradle.kts, packaging/windows)
compose.preserve.working.dir=true
